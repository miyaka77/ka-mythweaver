            function diagnosticCheck() {
                const issues=[];
                const warnings=[];
                const infos=[];
                const scenes=Array.isArray(gameData.scenes)?gameData.scenes:[];
                const vars=Array.isArray(gameData.variables)?gameData.variables:[];
                const ids=new Map(); const varNames=new Map();
                scenes.forEach(s=>{ if(ids.has(s.id)) issues.push({title:'场景 ID 重复',detail:`「${s.title||'未命名'}」与另一个场景使用了相同 ID。`,sceneId:s.id}); else ids.set(s.id,s); });
                vars.forEach(v=>{ const n=String(v?.name||'').trim(); if(!n) warnings.push({title:'存在空变量名',detail:'请给变量设置一个唯一名称。'}); else if(varNames.has(n)) issues.push({title:'变量名称重复',detail:`变量「${n}」重复，条件和变量变化可能产生歧义。`}); else varNames.set(n,v); });
                if(!scenes.length) issues.push({title:'没有场景',detail:'至少创建一个场景才能运行游戏。'});
                const start=getSceneById(gameData.startSceneId);
                if(!start) issues.push({title:'没有有效的起始场景',detail:'请设置一个场景为「起始场景」。'});
                const sceneSet=new Set(scenes.map(s=>s.id));
                scenes.forEach(s=>{
                    (s.options||[]).forEach((o,i)=>{
                        if(o.targetId && !sceneSet.has(o.targetId)) issues.push({title:`选项「${o.text||'未命名'}」目标不存在`,detail:`场景「${s.title||'未命名'}」的第 ${i+1} 个选项指向了不存在的场景。`,sceneId:s.id});
                        if(o.failTargetId && !sceneSet.has(o.failTargetId)) issues.push({title:`失败跳转目标不存在`,detail:`场景「${s.title||'未命名'}」的选项「${o.text||'未命名'}」引用了不存在的失败场景。`,sceneId:s.id});
                        if(o.conditionEnabled && o.conditionVariable && !varNames.has(o.conditionVariable)) warnings.push({title:'条件引用了不存在的变量',detail:`场景「${s.title||'未命名'}」的选项「${o.text||'未命名'}」引用「${o.conditionVariable}」。`,sceneId:s.id});
                        Object.keys(o.variableChanges||{}).forEach(n=>{if(!varNames.has(n)) warnings.push({title:'变量变化引用了不存在的变量',detail:`场景「${s.title||'未命名'}」的选项「${o.text||'未命名'}」会修改「${n}」。`,sceneId:s.id});});
                    });
                    normalizeSpecialWheel(s); const w=s.specialWheel;
                    if(w.enabled){
                        if(!w.triggerVariable) warnings.push({title:'特殊转盘没有触发变量',detail:`场景「${s.title||'未命名'}」已启用特殊转盘，但没有选择触发变量。`,sceneId:s.id});
                        else if(!varNames.has(w.triggerVariable)) warnings.push({title:'特殊转盘引用了不存在的变量',detail:`「${s.title||'未命名'}」的特殊转盘引用「${w.triggerVariable}」。`,sceneId:s.id});
                        if(!(w.items||[]).some(x=>String(x?.text||'').trim())) issues.push({title:'特殊转盘没有有效奖励',detail:`「${s.title||'未命名'}」已启用特殊转盘，但没有可抽取的奖励。`,sceneId:s.id});
                    }
                    if(s.isEnding && (s.options||[]).some(o=>o.text?.trim())) warnings.push({title:'结局场景仍有选项',detail:`「${s.title||'未命名'}」被标记为结局，但仍配置了选项。预览时仍可能继续走。`,sceneId:s.id});
                });
                if(start){
                    const seen=new Set([start.id]); const q=[start.id];
                    while(q.length){ const id=q.shift(), s=getSceneById(id); (s?.options||[]).forEach(o=>{[o.targetId,o.failTargetId].forEach(t=>{if(t&&sceneSet.has(t)&&!seen.has(t)){seen.add(t);q.push(t);}});}); }
                    scenes.forEach(s=>{if(!seen.has(s.id)) warnings.push({title:'场景无法从起点到达',detail:`「${s.title||'未命名'}」没有从起始场景沿选项连接到达。`,sceneId:s.id});});
                }
                if(!issues.length&&!warnings.length) infos.push('没有发现明显的结构问题，可以安心继续制作 ✨');
                return {issues,warnings,infos};
            }

            function openDiagnostics() {
                const r=diagnosticCheck();
                const total=r.issues.length+r.warnings.length;
                const el=document.getElementById('diagnosticContent');
                const summary=total?`<div class="diagnostic-summary">⚠️ 发现 <strong>${total}</strong> 个需要留意的问题：${r.issues.length} 个错误、${r.warnings.length} 个提醒。</div>`:`<div class="diagnostic-summary ok">✨ 检查完成，没有发现明显问题。</div>`;
                const list=[...r.issues.map(x=>({...x,level:'error'})),...r.warnings.map(x=>({...x,level:'warning'}))];
                const html=list.length?`<div class="diagnostic-list">${list.map(x=>`<div class="diagnostic-item"><span class="diag-icon">${x.level==='error'?'❌':'⚠️'}</span><div class="diag-main"><div class="diag-title">${escapeHtml(x.title)}</div><div class="diag-detail">${escapeHtml(x.detail)}</div></div>${x.sceneId?`<button data-diag-scene="${escapeHtml(x.sceneId)}">查看</button>`:''}</div>`).join('')}</div>`:'<div class="diagnostic-list"><div class="diagnostic-item"><span class="diag-icon">💗</span><div class="diag-main"><div class="diag-title">结构很干净</div><div class="diag-detail">目前没有发现明显的断链、变量引用或特殊事件配置问题。</div></div></div></div>';
                el.innerHTML=summary+html+'<div class="diagnostic-legend">检查只读取当前编辑数据，不会自动修改任何内容。部分“无法到达”提示可能是你故意保留的隐藏场景，可以忽略。</div>';
                el.querySelectorAll('[data-diag-scene]').forEach(btn=>btn.addEventListener('click',()=>{closeDiagnostics();openSceneEditor(btn.dataset.diagScene);}));
                document.getElementById('diagnosticModal').classList.add('active');
            }
            function closeDiagnostics(){document.getElementById('diagnosticModal').classList.remove('active');}

            function deleteScene(id) {
                const s = getSceneById(id);
                if (!s) return;
                showModal('删除场景', `确定删除「${s.title||'未命名'}」？`, () => {
                    gameData.scenes = gameData.scenes.filter(x => x.id !== id);
                    gameData.scenes.forEach(x => { x.options = (x.options || []).map(o => ({ ...o, targetId: (o
                                .targetId && getSceneById(o.targetId)) ? o.targetId : null,
                            failTargetId: (o.failTargetId && getSceneById(o.failTargetId)) ? o
                                .failTargetId : null })); });
                    if (gameData.startSceneId === id) gameData.startSceneId = gameData.scenes.length > 0 ? gameData
                        .scenes[0].id : null;
                    saveData();
                    fullRefreshSceneCards();
                    updateStartBadge();
                    showToast('场景已删除');
                    goBackToList();
                });
            }

            // ---------- 预览相关（修改了历史栏和转盘UI） ----------
            let previewCurrentSceneId = null;
            let previewHistory = [];
            let wheelAnimationId = null;
            let isWheelSpinning = false;
            let wheelCurrentAngle = 0;
            const wheelColors = ['#FFD4D4', '#FFE0E0', '#FFCCCC', '#F5C0C0', '#FFD8D8', '#FAD0D0', '#FFC8C8', '#FDD8D8',
                '#FFDFDF', '#FDD0D0', '#FFE8E0', '#FCE0D8', '#FFDEDE', '#F8D0D0', '#FFE5E0'
            ];

            // 历史栏展开状态
            let historyExpanded = false;

            function initPlayerState() {
                playerState = {};
                if (gameData.variables) gameData.variables.forEach(v => { playerState[v.name] = v.initialValue; });
                playerAchievements = [];
                playerItems = [];
                specialWheelReturnPending = false;
                gameData.scenes.forEach(s => { normalizeSpecialWheel(s); s.specialWheel.used = false; });
            }

            function evaluateCondition(option) {
                if (!option.conditionEnabled || !option.conditionVariable) return true;
                const varName = option.conditionVariable;
                const operator = option.conditionOperator || '>=';
                const targetValue = option.conditionValue || 0;
                const currentValue = playerState[varName] !== undefined ? playerState[varName] : 0;
                switch (operator) {
                    case '>=':
                        return currentValue >= targetValue;
                    case '<=':
                        return currentValue <= targetValue;
                    case '>':
                        return currentValue > targetValue;
                    case '<':
                        return currentValue < targetValue;
                    case '=':
                        return currentValue === targetValue;
                    default:
                        return true;
                }
            }

            function applyVariableChanges(option) {
                if (!option || !option.variableChanges) return;
                Object.keys(option.variableChanges).forEach(varName => {
                    const delta = option.variableChanges[varName];
                    if (delta !== 0) {
                        playerState[varName] = (playerState[varName] || 0) + delta;
                        showToast(`${varName} ${delta>0?'+':''}${delta}`, '');
                    }
                });
            }

            function recordAchievement(option) {
                if (option.achievement && option.achievement.trim()) {
                    if (!playerAchievements.includes(option.achievement.trim())) {
                        playerAchievements.push(option.achievement.trim());
                        showToast(`🏆 获得成就：「${option.achievement.trim()}」`, '');
                    }
                }
            }

            function addHistoryEntry(option, targetId) {
                const cur = getSceneById(previewCurrentSceneId);
                previewHistory.push({
                    sceneId: previewCurrentSceneId,
                    sceneTitle: (cur && cur.title) || '未知',
                    optionText: option.text || '未知',
                    nextSceneId: targetId || null
                });
                // 新添加时重置展开状态为折叠（不自动展开）
                historyExpanded = false;
            }

            function navigateToScene(sceneId, option) {
                addHistoryEntry(option, sceneId);
                if (sceneId && getSceneById(sceneId)) {
                    previewCurrentSceneId = sceneId;
                    renderPreviewScene();
                } else {
                    renderEndingWithReview(option);
                }
            }

            function getTriggeredSpecialWheel(preferredScene) {
                // 先检查当前场景；如果变量是在这里刚刚达到条件，就优先触发这里的 💎。
                if (preferredScene && shouldTriggerSpecialWheel(preferredScene)) return preferredScene;
                // 特殊奖励属于整个剧情的旁支事件：变量一旦达到条件，下一次普通路线推进前就可以触发。
                // 按场景顺序寻找第一个可触发事件，避免一次跳出多个奖励转盘。
                for (const s of gameData.scenes) {
                    if (preferredScene && s.id === preferredScene.id) continue;
                    if (shouldTriggerSpecialWheel(s)) return s;
                }
                return null;
            }

            function executeOptionSuccess(option) {
                const sourceScene = getSceneById(previewCurrentSceneId);
                if (!sourceScene) return;
                // 必须先结算选项带来的变量变化，再检查 💎 条件。
                applyVariableChanges(option);
                recordAchievement(option);
                const specialScene = getTriggeredSpecialWheel(sourceScene);
                if (specialScene) {
                    // 保存玩家原本要走的路线；💎 只作为中间插曲，不写入主路线。
                    specialWheelReturnPending = {
                        targetId: option.targetId || null,
                        option: { ...option },
                        sourceSceneId: sourceScene.id
                    };
                    buildSpecialWheelUI(specialScene);
                    return;
                }
                navigateToScene(option.targetId, option);
            }

            function executeOptionFail(option) {
                if (option.failTargetId && getSceneById(option.failTargetId)) {
                    navigateToScene(option.failTargetId, option);
                } else {
                    addHistoryEntry(option, null);
                    renderEndingWithReview(option);
                }
            }

            function processOptionResult(option) {
                if (!option) return;
                const conditionPassed = evaluateCondition(option);
                const hasCondition = option.conditionEnabled && option.conditionVariable;
                if (hasCondition) {
                    if (conditionPassed) {
                        showToast('✅ 判定成功');
                        if (showOptionPopup) PopupManager.show(option.text || '未知选项', () => { executeOptionSuccess(
                                option); }, 'success');
                        else setTimeout(() => executeOptionSuccess(option), 800);
                    } else {
                        showToast('❌ 判定失败', 'warning');
                        if (showOptionPopup) PopupManager.show(option.text || '未知选项', () => { executeOptionFail(
                                option); }, 'fail');
                        else setTimeout(() => executeOptionFail(option), 800);
                    }
                } else {
                    if (showOptionPopup) PopupManager.show(option.text || '未知选项', () => { executeOptionSuccess(
                            option); }, 'normal');
                    else setTimeout(() => executeOptionSuccess(option), 800);
                }
            }

            function drawWheel(canvas, sectors, rotationAngle, highlightIndex = -1) {
                const size = Math.min(canvas.parentElement.clientWidth, canvas.parentElement.clientHeight);
                canvas.width = size * (window.devicePixelRatio || 1);
                canvas.height = size * (window.devicePixelRatio || 1);
                canvas.style.width = size + 'px';
                canvas.style.height = size + 'px';
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, size, size);
                const cx = size / 2,
                    cy = size / 2,
                    radius = size / 2 - 4;
                const n = sectors.length;
                if (n === 0) return;
                const sliceAngle = (2 * Math.PI) / n;
                for (let i = 0; i < n; i++) {
                    const startA = -Math.PI / 2 + i * sliceAngle + rotationAngle;
                    const endA = startA + sliceAngle;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, startA, endA);
                    ctx.closePath();
                    ctx.fillStyle = (i === highlightIndex) ? '#FFFFFF' : wheelColors[i % wheelColors.length];
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    const midA = startA + sliceAngle / 2;
                    ctx.save();
                    ctx.translate(cx + Math.cos(midA) * radius * 0.62, cy + Math.sin(midA) * radius * 0.62);
                    ctx.rotate(midA + Math.PI / 2);
                    ctx.fillStyle = '#5C4A4A';
                    ctx.font = `600 ${Math.max(10,12-n)}px sans-serif`;
                    let label = sectors[i].text || '选项';
                    if (label.length > 5) label = label.substring(0, 4) + '…';
                    ctx.fillText(label, 0, 0);
                    ctx.restore();
                }
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.25, 0, 2 * Math.PI);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();
                ctx.strokeStyle = '#F0E0E0';
                ctx.stroke();
            }

            function getWheelResult(sectors, angle) {
                const n = sectors.length;
                if (!n) return -1;
                const slice = (2 * Math.PI) / n;
                const norm = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                const pointer = (2 * Math.PI - norm) % (2 * Math.PI);
                return Math.min(Math.floor(pointer / slice), n - 1);
            }

            let lastTickSector = -1;

            function stopWheelAndResolve(sectors, targetAngle) {
                if (wheelAnimationId) { cancelAnimationFrame(wheelAnimationId);
                    wheelAnimationId = null; }
                isWheelSpinning = false;
                wheelCurrentAngle = targetAngle;
                const canvas = document.getElementById('wheelCanvas');
                if (canvas) { drawWheel(canvas, sectors, targetAngle, getWheelResult(sectors, targetAngle));
                    canvas.classList.remove('spinning'); }
                const idx = getWheelResult(sectors, targetAngle);
                const hint = document.getElementById('wheelResultHint');
                if (hint && idx >= 0) { hint.textContent = '🎯 命运选择了：「' + (sectors[idx].text || '未知') + '」';
                    hint.classList.add('show'); }
                document.getElementById('wheelCenterBtn').disabled = true;
                lastTickSector = -1;
                AudioFeedback.playResult();
                AudioFeedback.vibrate([30, 60, 30]);
                if (idx >= 0) processOptionResult(sectors[idx]);
            }

            function spinWheel(sectors) {
                if (isWheelSpinning) return;
                isWheelSpinning = true;
                const canvas = document.getElementById('wheelCanvas');
                canvas?.classList.add('spinning');
                document.getElementById('wheelCenterBtn').disabled = true;
                document.getElementById('wheelResultHint').classList.remove('show');
                lastTickSector = -1;
                const extra = 6 + Math.floor(Math.random() * 5);
                const target = wheelCurrentAngle + extra * 2 * Math.PI + Math.random() * 2 * Math.PI;
                const start = wheelCurrentAngle;
                const duration = 3000 + Math.random() * 800;
                const startTime = performance.now();
                AudioFeedback.playSpinStart();
                AudioFeedback.vibrate(20);

                function anim(now) {
                    const p = Math.min((now - startTime) / duration, 1);
                    const eased = 1 - Math.pow(1 - p, 3.5);
                    const curAngle = start + (target - start) * eased;
                    wheelCurrentAngle = curAngle;
                    if (canvas) drawWheel(canvas, sectors, curAngle, -1);
                    const curSec = getWheelResult(sectors, curAngle % (2 * Math.PI));
                    if (curSec !== lastTickSector && curSec >= 0) { lastTickSector = curSec;
                        AudioFeedback.playTick();
                        AudioFeedback.vibrate(8); }
                    if (p < 1) wheelAnimationId = requestAnimationFrame(anim);
                    else { wheelCurrentAngle = target % (2 * Math.PI);
                        stopWheelAndResolve(sectors, target % (2 * Math.PI)); }
                }
                wheelAnimationId = requestAnimationFrame(anim);
            }

            function buildWheelUI(sectors) {
                const wrapper = document.createElement('div');
                wrapper.className = 'wheel-wrapper';
                wrapper.innerHTML = `<div class="wheel-pointer-icon">▼</div><div class="wheel-canvas-container"><canvas id="wheelCanvas"></canvas><button class="wheel-center-btn" id="wheelCenterBtn">旋转</button></div>`;
                const hint = document.createElement('div'); hint.className='wheel-result-hint'; hint.id='wheelResultHint';
                const area=document.getElementById('previewOptionsArea'); area.innerHTML=''; area.append(wrapper,hint);
                const canvas=document.getElementById('wheelCanvas'); if(canvas){wheelCurrentAngle=0;drawWheel(canvas,sectors,0,-1);}
                if (document.getElementById('wheelCenterBtn')) document.getElementById('wheelCenterBtn').onclick=()=>spinWheel(sectors);
                isWheelSpinning=false;
            }

            function buildSpecialWheelUI(scene) {
                normalizeSpecialWheel(scene);
                const w=scene.specialWheel;
                const sectors=w.items.filter(x=>x && x.text && x.text.trim());
                const area=document.getElementById('previewOptionsArea'); area.innerHTML='';
                const banner=document.createElement('div'); banner.className='special-wheel-banner'; banner.innerHTML=`<strong>🎁 ${escapeHtml(w.name||'特殊奖励')}</strong>条件已满足，获得一次额外抽取机会。抽取不会改变你的原剧情路线。`;
                const wrapper=document.createElement('div'); wrapper.className='wheel-wrapper';
                wrapper.innerHTML=`<div class="wheel-pointer-icon">▼</div><div class="wheel-canvas-container"><canvas id="wheelCanvas"></canvas><button class="wheel-center-btn" id="wheelCenterBtn">抽取奖励</button></div>`;
                const hint=document.createElement('div'); hint.className='wheel-result-hint'; hint.id='wheelResultHint';
                area.append(banner,wrapper,hint);
                const canvas=document.getElementById('wheelCanvas'); if(canvas){wheelCurrentAngle=0;drawWheel(canvas,sectors,0,-1);}
                if (document.getElementById('wheelCenterBtn')) document.getElementById('wheelCenterBtn').onclick=()=>spinSpecialWheel(scene,sectors);
                isWheelSpinning=false;
            }

            function spinSpecialWheel(scene,sectors){
                if(isWheelSpinning || !sectors.length) return;
                isWheelSpinning=true;
                const canvas=document.getElementById('wheelCanvas'); canvas?.classList.add('spinning');
                const btn=document.getElementById('wheelCenterBtn'); if(btn) btn.disabled=true;
                const hint=document.getElementById('wheelResultHint'); hint?.classList.remove('show'); lastTickSector=-1;
                const extra=6+Math.floor(Math.random()*5), target=wheelCurrentAngle+extra*2*Math.PI+Math.random()*2*Math.PI, start=wheelCurrentAngle, duration=3000+Math.random()*800, startTime=performance.now();
                AudioFeedback.playSpinStart(); AudioFeedback.vibrate(20);
                function anim(now){
                    const p=Math.min((now-startTime)/duration,1), eased=1-Math.pow(1-p,3.5), cur=start+(target-start)*eased; wheelCurrentAngle=cur;
                    if(canvas) drawWheel(canvas,sectors,cur,-1); const curSec=getWheelResult(sectors,cur%(2*Math.PI));
                    if(curSec!==lastTickSector&&curSec>=0){lastTickSector=curSec;AudioFeedback.playTick();AudioFeedback.vibrate(8);}
                    if(p<1) wheelAnimationId=requestAnimationFrame(anim); else finishSpecialWheel(scene,sectors,target%(2*Math.PI));
                }
                wheelAnimationId=requestAnimationFrame(anim);
            }

            function finishSpecialWheel(scene,sectors,targetAngle){
                if(wheelAnimationId){cancelAnimationFrame(wheelAnimationId);wheelAnimationId=null;} isWheelSpinning=false; wheelCurrentAngle=targetAngle;
                const idx=getWheelResult(sectors,targetAngle), item=idx>=0?sectors[idx]:null, hint=document.getElementById('wheelResultHint');
                const canvas=document.getElementById('wheelCanvas'); if(canvas){drawWheel(canvas,sectors,targetAngle,idx);canvas.classList.remove('spinning');}
                if(item){
                    if(!playerItems.includes(item.text.trim())) playerItems.push(item.text.trim());
                    hint.textContent='🎁 获得了：「'+item.text+'」'; hint.classList.add('show');
                    showToast(`🎁 获得「${item.text.trim()}」`);
                }
                const btn=document.getElementById('wheelCenterBtn'); if(btn) btn.disabled=true; lastTickSector=-1; AudioFeedback.playResult(); AudioFeedback.vibrate([30,60,30]);
                markSpecialWheelUsed(scene);
                setTimeout(()=>{
                    const pending = specialWheelReturnPending;
                    specialWheelReturnPending = false;
                    if (pending && typeof pending === 'object') {
                        navigateToScene(pending.targetId, pending.option || {text:'继续'});
                    } else {
                        renderPreviewScene(true);
                    }
                }, 900);
            }

            let collectionExpanded = false;

            function renderCollectionHtml(finalView = false) {
                if (!playerItems.length) return '';
                const chips = playerItems.map(x => `<span class="collection-chip">✦ ${escapeHtml(x)}</span>`).join('');
                if (finalView) {
                    return `<div class="collection-box final"><span class="collection-gem">💎</span><div class="collection-items">${chips}</div></div>`;
                }
                return `<div class="collection-box${collectionExpanded ? ' expanded' : ''}" id="collectionBox"><span class="collection-gem">💎</span><div class="collection-items">${chips}</div><span class="collection-more">…</span></div>`;
            }

            function bindCollectionBox() {
                const box=document.getElementById('collectionBox');
                if(!box) return;
                const items=box.querySelector('.collection-items');
                if(items && items.scrollHeight > items.clientHeight + 2 && !collectionExpanded) box.classList.add('has-more');
                if(items && items.scrollHeight > items.clientHeight + 2) {
                    box.addEventListener('click',()=>{ collectionExpanded=!collectionExpanded; updateHistoryDisplay(); });
                }
            }

            // ---- 更新历史栏（命运之路 + 仅在有内容时出现的 💎 粉色收藏框） ----
            function updateHistoryDisplay() {
                const c = document.getElementById('historyBar');
                if (!c) return;
                const collectionHtml = renderCollectionHtml(false);
                if (previewHistory.length === 0) {
                    c.innerHTML = '<span class="history-bar-label">🗺️ 命运之路</span><span class="history-empty">尚未选择</span>';
                    const old = document.getElementById('collectionBox'); if(old) old.remove();
                    if(collectionHtml) c.insertAdjacentHTML('afterend', collectionHtml);
                    bindCollectionBox();
                    return;
                }
                const chipsHtml = previewHistory.map(item => `<span class="history-chip">${escapeHtml(item.optionText)}</span>`).join('<span style="color:#E0C0C0;">→</span>');
                const MAX_VISIBLE = 4;
                const total = previewHistory.length;
                let displayHtml = chipsHtml, toggleBtnHtml = '';
                if (total > MAX_VISIBLE) {
                    if (historyExpanded) {
                        displayHtml = chipsHtml;
                        toggleBtnHtml = `<button class="history-toggle-btn" id="historyToggleBtn">收起</button>`;
                    } else {
                        const visible = previewHistory.slice(0, MAX_VISIBLE).map(item => `<span class="history-chip">${escapeHtml(item.optionText)}</span>`).join('<span style="color:#E0C0C0;">→</span>');
                        displayHtml = visible + ' <span style="color:#C0B0B0;font-size:10px;">…</span>';
                        toggleBtnHtml = `<button class="history-toggle-btn" id="historyToggleBtn">展开 (${total-MAX_VISIBLE})</button>`;
                    }
                }
                c.innerHTML = `<span class="history-bar-label">🗺️ 命运之路</span> ${displayHtml} ${toggleBtnHtml}`;
                const toggleBtn=document.getElementById('historyToggleBtn');
                if(toggleBtn) toggleBtn.addEventListener('click',e=>{e.stopPropagation();historyExpanded=!historyExpanded;updateHistoryDisplay();});
                const old = document.getElementById('collectionBox'); if(old) old.remove();
                if(collectionHtml) c.insertAdjacentHTML('afterend', collectionHtml);
                bindCollectionBox();
            }

            function renderPlayerStateBar() {
                if (!gameData.variables || gameData.variables.length === 0) return '';
                let html = '<div class="player-state-bar">';
                gameData.variables.forEach(v => {
                    const val = playerState[v.name] !== undefined ? playerState[v.name] : v.initialValue;
                    html += `<span class="player-state-chip">${escapeHtml(v.name)}: <span style="color:var(--var-accent);">${val}</span></span>`;
                });
                html += '</div>';
                return html;
            }

            function renderEndingWithReview(finalOption) {
                const cur = getSceneById(previewCurrentSceneId);
                const title = (cur && cur.title) || '未知';
                const content = cur ? cur.content : '';
                const isEnding = cur && cur.isEnding;
                let html = '<div class="review-panel"><div class="review-title">📜 命运回顾</div><div class="review-subtitle">旅程终章</div>';
                if (gameData.variables.length > 0) {
                    html += '<div class="player-state-bar" style="margin-bottom:8px;">';
                    gameData.variables.forEach(v => { html +=
                            `<span class="player-state-chip">${escapeHtml(v.name)}: <span style="color:var(--var-accent);">${playerState[v.name]!==undefined?playerState[v.name]:v.initialValue}</span></span>`; });
                    html += '</div>';
                }
                if (playerAchievements.length > 0) {
                    html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">';
                    playerAchievements.forEach(a => { html += `<span class="achievement-chip">🏆 ${escapeHtml(a)}</span>`; });
                    html += '</div>';
                }
                html += renderCollectionHtml(true);
                html += '<div class="review-timeline">';
                const start = getSceneById(gameData.startSceneId);
                html +=
                    `<div class="review-step"><div class="review-step-scene">🏁 ${escapeHtml((start&&start.title)||'起始')}</div></div>`;
                previewHistory.forEach(item => {
                    html +=
                        `<div class="review-step"><div class="review-step-scene">📍 ${escapeHtml(item.sceneTitle)}</div><div class="review-step-choice">↳ ${escapeHtml(item.optionText)}</div></div>`;
                });
                html +=
                    `<div class="review-step${isEnding?' review-step-ending':''}"><div class="review-step-scene">🔚 ${escapeHtml(title)}</div><div class="review-step-choice">最终：${escapeHtml(finalOption.text||'未知')}</div>`;
                if (isEnding) html += '<span class="review-ending-tag gold">🏆 结局达成</span>';
                else html += '<span class="review-ending-tag">✨ 故事终章</span>';
                if (content.trim()) html += `<div class="review-scene-content">${escapeHtml(content)}</div>`;
                html +=
                    `</div></div><div class="review-actions"><button class="btn-review-restart" id="btnReviewRestart">↺ 重新开始</button><button class="btn-review-close" id="btnReviewClose">✕ 关闭</button></div></div>`;
                document.getElementById('previewContent').innerHTML = html;
                document.getElementById('previewContent').scrollTop = 0;
                document.getElementById('previewOptionsArea').innerHTML = '';
                setTimeout(() => {
                    document.getElementById('btnReviewRestart')?.addEventListener('click', restartPreview);
                    document.getElementById('btnReviewClose')?.addEventListener('click', closePreview);
                }, 100);
            }

            function renderPreviewScene(skipSpecialCheck = false) {
                if (wheelAnimationId) cancelAnimationFrame(wheelAnimationId);
                isWheelSpinning = false;
                const scene = getSceneById(previewCurrentSceneId);
                if (!scene) {
                    document.getElementById('previewContent').innerHTML =
                        '<div class="preview-end-message"><strong>🔚 游戏结束</strong><p>场景不存在。</p></div>';
                    document.getElementById('previewOptionsArea').innerHTML =
                        '<button class="preview-restart-btn" onclick="restartPreview()">↺ 重新开始</button>';
                    return;
                }
                let html = `${renderPlayerStateBar()}<div class="history-bar" id="historyBar"></div><div class="preview-scene-title">${escapeHtml(scene.title||'')}</div><div class="preview-scene-text">${escapeHtml(scene.content||'')}</div>`;
                document.getElementById('previewContent').innerHTML = html;
                updateHistoryDisplay();
                const valid = (scene.options || []).filter(o => o.text?.trim());
                if (!valid.length) { renderEndingWithReview({ text: '无选项' }); } else buildWheelUI(valid);
            }

            function openPreview() {
                if (!gameData.scenes.length) { showToast('请先创建场景', 'warning'); return; }
                if (!gameData.startSceneId || !getSceneById(gameData.startSceneId)) { gameData.startSceneId = gameData.scenes[0]
                        .id;
                    saveData(); }
                previewCurrentSceneId = gameData.startSceneId;
                previewHistory = [];
                historyExpanded = false;
                collectionExpanded = false;
                initPlayerState();
                document.getElementById('previewGameTitle').textContent = 'your future .....?';
                document.getElementById('previewOverlay').classList.add('active');
                document.body.style.overflow = 'hidden';
                AudioFeedback.init();
                renderPreviewScene();
            }

            function closePreview() {
                if (wheelAnimationId) cancelAnimationFrame(wheelAnimationId);
                isWheelSpinning = false;
                PopupManager.close();
                document.getElementById('previewOverlay').classList.remove('active');
                document.body.style.overflow = '';
                previewCurrentSceneId = null;
                previewHistory = [];
                renderListView();
            }

            function restartPreview() {
                if (wheelAnimationId) cancelAnimationFrame(wheelAnimationId);
                isWheelSpinning = false;
                PopupManager.close();
                previewCurrentSceneId = gameData.startSceneId;
                previewHistory = [];
                historyExpanded = false;
                collectionExpanded = false;
                initPlayerState();
                renderPreviewScene();
            }

            // ---------- 导入导出 Modal 控制 ----------
            function openExportModal() {
                if (!gameData.scenes.length) { showToast('没有可导出内容', 'warning'); return; }
                document.getElementById('exportCodeText').value = generateExportCode();
                document.getElementById('exportModal').classList.add('active');
                switchExportTab('file');
            }

            function closeExportModal() {
                document.getElementById('exportModal').classList.remove('active');
            }

            function switchExportTab(tab) {
                const tabs = document.querySelectorAll('#exportTabs .io-tab');
                const panels = {
                    file: document.getElementById('exportFilePanel'),
                    code: document.getElementById('exportCodePanel')
                };
                tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
                Object.entries(panels).forEach(([k, p]) => p.classList.toggle('active', k === tab));
            }

            function openImportModal() {
                document.getElementById('importModal').classList.add('active');
                document.getElementById('fileStatus').textContent = '';
                document.getElementById('fileDropZone').classList.remove('has-file');
                document.getElementById('importCodeText').value = '';
                const fileInput = document.getElementById('fileImportInput');
                fileInput.value = '';
                switchImportTab('file');
            }

            function closeImportModal() {
                document.getElementById('importModal').classList.remove('active');
                const fileInput = document.getElementById('fileImportInput');
                fileInput.value = '';
                document.getElementById('fileStatus').textContent = '';
                document.getElementById('fileDropZone').classList.remove('has-file');
            }

            function switchImportTab(tab) {
                const tabs = document.querySelectorAll('#importTabs .io-tab');
                const panels = {
                    file: document.getElementById('importFilePanel'),
                    code: document.getElementById('importCodePanel')
                };
                tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
                Object.entries(panels).forEach(([k, p]) => p.classList.toggle('active', k === tab));
            }

            function doImport(data, onComplete) {
                const result = applyImportedData(data);
                const title = result.title || '导入的游戏';
                const count = result.scenes.length;
                const varCount = result.variables.length;
                showModal('确认导入', `将导入「${title}」(${count}个场景，${varCount}个变量)\n当前数据将被覆盖，确定继续？`, () => {
                    gameData.title = title;
                    gameData.startSceneId = result.startSceneId;
                    gameData.scenes = result.scenes;
                    gameData.variables = result.variables;
                    saveData();
                    renderListView();
                    fullRefreshSceneCards();
                    updateStartBadge();
                    document.getElementById('gameTitleInput').value = gameData.title;
                    showToast('导入成功 📥');
                    if (onComplete) onComplete();
                });
            }

            // ---------- 事件绑定 ----------
            document.addEventListener('DOMContentLoaded', function() {
                // 稳定性保护：单个可选控件异常时，不应让整个编辑器失去响应。
                window.addEventListener('error', function(ev) {
                    console.error('[momo-mythweaver]', ev.error || ev.message);
                });
                // ---- 重置 ----
                document.getElementById('btnReset')?.addEventListener('click', resetToDefault);

                // ---- 导出 ----
                document.getElementById('btnExport')?.addEventListener('click', openExportModal);
                document.getElementById('exportCodeClose')?.addEventListener('click', closeExportModal);
                document.getElementById('exportCodeCopy')?.addEventListener('click', function() {
                    const code = document.getElementById('exportCodeText').value;
                    if (!code) return;
                    navigator.clipboard?.writeText(code).then(() => showToast('已复制 ✅')).catch(() => {
                        document.getElementById('exportCodeText').select();
                        document.execCommand('copy') ? showToast('已复制 ✅') : showToast('复制失败',
                        'warning');
                    });
                });
                document.getElementById('btnExportFile')?.addEventListener('click', function() {
                    exportAsFile();
                    closeExportModal();
                });
                document.querySelectorAll('#exportTabs .io-tab').forEach(tab => {
                    tab.addEventListener('click', function() { switchExportTab(this.dataset.tab); });
                });

                // ---- 导入 ----
                document.getElementById('btnImport')?.addEventListener('click', openImportModal);
                document.getElementById('importFileCancel')?.addEventListener('click', closeImportModal);
                document.getElementById('importCodeCancel')?.addEventListener('click', closeImportModal);

                const fileInput = document.getElementById('fileImportInput');
                const dropZone = document.getElementById('fileDropZone');
                const fileStatus = document.getElementById('fileStatus');

                if (dropZone && fileInput) dropZone.addEventListener('click', () => fileInput.click());

                if (fileInput) fileInput.addEventListener('change', function(e) {
                    const file = this.files[0];
                    if (!file) return;
                    handleImportFile(file);
                });

                if (dropZone) dropZone.addEventListener('dragover', (e) => { e.preventDefault();
                    dropZone.style.borderColor = 'var(--accent-pink)'; });
                if (dropZone) dropZone.addEventListener('dragleave', (e) => { e.preventDefault();
                    dropZone.style.borderColor = ''; });
                if (dropZone) dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.style.borderColor = '';
                    const file = e.dataTransfer.files[0];
                    if (file) handleImportFile(file);
                });

                function handleImportFile(file) {
                    if (!file.name.endsWith('.json')) { showToast('请选择 .json 文件', 'warning'); return; }
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const data = JSON.parse(e.target.result);
                            const valid = validateImportData(data);
                            if (!valid.valid) { showToast(valid.error, 'warning'); return; }
                            closeImportModal();
                            doImport(data, () => {});
                        } catch (err) { showToast('文件解析失败：' + err.message, 'warning'); }
                    };
                    reader.readAsText(file);
                }

                document.getElementById('importCodePaste')?.addEventListener('click', function() {
                    if (!navigator.clipboard?.readText) { showToast('当前环境不支持读取剪贴板', 'warning'); return; }
                    navigator.clipboard.readText().then(text => {
                        document.getElementById('importCodeText').value = text;
                        const result = tryParseImportCode(text);
                        if (result.valid) showToast('已粘贴，可导入 ✅');
                        else showToast('粘贴完成，但内容无效：' + result.error, 'warning');
                    }).catch(() => showToast('无法访问剪贴板', 'warning'));
                });

                document.getElementById('importCodeConfirm')?.addEventListener('click', function() {
                    const code = document.getElementById('importCodeText').value;
                    const result = tryParseImportCode(code);
                    if (!result.valid) { showToast(result.error, 'warning'); return; }
                    closeImportModal();
                    doImport(result.data, () => {
                        document.getElementById('importCodeText').value = '';
                    });
                });

                document.querySelectorAll('#importTabs .io-tab').forEach(tab => {
                    tab.addEventListener('click', function() { switchImportTab(this.dataset.tab); });
                });

                document.getElementById('sceneCardsContainer')?.addEventListener('click', function(e){
                    const btn=e.target.closest('[data-copy-scene]');
                    if(btn){ e.stopPropagation(); copyScene(btn.dataset.copyScene); }
                });

                // ---- 通用 ----
                document.getElementById('btnAddScene')?.addEventListener('click', addNewScene);
                document.getElementById('btnDiagnostics')?.addEventListener('click', openDiagnostics);
                document.getElementById('diagnosticClose')?.addEventListener('click', closeDiagnostics);
                document.getElementById('diagnosticModal')?.addEventListener('click', function(e){ if(e.target===this) closeDiagnostics(); });
                document.getElementById('sceneSearch')?.addEventListener('input', refreshSearchUI);
                document.getElementById('sceneSearchClear')?.addEventListener('click', function(){ const i=document.getElementById('sceneSearch'); i.value=''; refreshSearchUI(); i.focus(); });
                document.getElementById('btnPreview')?.addEventListener('click', openPreview);
                document.getElementById('btnPreviewBack')?.addEventListener('click', closePreview);
                document.getElementById('btnPreviewRestart')?.addEventListener('click', restartPreview);

                document.getElementById('editSceneOrder')?.addEventListener('change', function() {
                    const s = getSceneById(currentEditingSceneId);
                    if (!s) return;
                    let newOrder = parseFloat(this.value);
                    if (isNaN(newOrder) || newOrder < 0) newOrder = s.order;
                    newOrder = Math.round(newOrder * 100) / 100;
                    s.order = newOrder;
                    gameData.scenes.sort((a, b) => a.order - b.order);
                    saveData();
                    fullRefreshSceneCards();
                    showToast('序号已更新');
                });

                document.getElementById('editIsStartScene')?.addEventListener('change', function() {
                    if (this.checked) gameData.startSceneId = currentEditingSceneId;
                    else if (gameData.startSceneId === currentEditingSceneId) gameData.startSceneId = gameData.scenes
                        .find(s => s.id !== currentEditingSceneId)?.id || null;
                    saveData();
                    updateStartBadge();
                });

                document.getElementById('editIsEndingScene')?.addEventListener('change', function() {
                    const s = getSceneById(currentEditingSceneId);
                    if (s) { s.isEnding = this.checked;
                        saveData();
                        updateCardBySceneId(s.id); }
                });

                if (document.getElementById('btnAddOption')) document.getElementById('btnAddOption').onclick = function() {
                    const s = getSceneById(currentEditingSceneId);
                    if (!s) return;
                    s.options.push({ text: '新选项', targetId: null, variableChanges: {}, achievement: '',
                        conditionEnabled: false, conditionVariable: '', conditionOperator: '>=',
                        conditionValue: 0, failTargetId: null });
                    saveData();
                    renderOptionsEditor(s);
                };

                if (document.getElementById('btnAddVariable')) document.getElementById('btnAddVariable').onclick = function() {
                    gameData.variables.push({ name: '变量', initialValue: 0 });
                    saveData();
                    renderVariableEditor();
                };

                if (document.getElementById('btnDeleteScene')) document.getElementById('btnDeleteScene').onclick = function() {
                    if (currentEditingSceneId) deleteScene(currentEditingSceneId);
                };

                document.getElementById('gameTitleInput')?.addEventListener('input', function() {
                    gameData.title = this.value || '祈祷喵🐱';
                    saveData();
                });

                document.getElementById('editSceneTitle')?.addEventListener('input', function() {
                    const s = getSceneById(currentEditingSceneId);
                    if (s) { s.title = this.value;
                        saveData();
                        updateCardBySceneId(s.id); }
                });

                document.getElementById('editSceneContent')?.addEventListener('input', function() {
                    const s = getSceneById(currentEditingSceneId);
                    if (s) { s.content = this.value;
                        saveData(); }
                });

                document.getElementById('modalCancel')?.addEventListener('click', hideModal);
                document.getElementById('modalConfirm')?.addEventListener('click', function() {
                    if (modalCallback) modalCallback();
                    hideModal();
                });

                document.getElementById('soundToggleBtn')?.addEventListener('click', () => AudioFeedback.toggle());
                document.getElementById('popupToggleBtn')?.addEventListener('click', () => setPopupEnabled(!showOptionPopup));

                AudioFeedback.setEnabled(true);
                setPopupEnabled(true);

                document.querySelectorAll('.modal-mask').forEach(mask => {
                    mask.addEventListener('click', function(e) {
                        if (e.target === this) {
                            if (this.id === 'exportModal') closeExportModal();
                            else if (this.id === 'importModal') closeImportModal();
                            else if (this.id === 'modalMask') hideModal();
                        }
                    });
                });

                // ---- 初始化 ----
                loadData();
                renderListView();
                updateStartBadge();
                if (document.getElementById('gameTitleInput')) document.getElementById('gameTitleInput').value = gameData.title;
            });

            window.restartPreview = restartPreview;

        })();
    </script>
</body>
</html>
